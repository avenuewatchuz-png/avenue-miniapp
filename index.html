<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Avenue Watches</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f3f2ef);
    --text: var(--tg-theme-text-color, #141414);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #b08d57);
    --btn: #b08d57;
    --btn-text: #ffffff;
    --gold: #b08d57;
    --radius: 16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg2);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body{padding-bottom:90px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid color-mix(in srgb,var(--hint) 35%,transparent);
    border-radius:12px;padding:12px 14px;width:100%;outline:none}
  input:focus,textarea:focus{border-color:var(--gold)}

  /* header */
  .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;
    box-shadow:0 1px 0 color-mix(in srgb,var(--hint) 18%,transparent)}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .logo{font-family:"Didot","Bodoni 72",Georgia,serif;letter-spacing:.32em;font-size:20px;font-weight:600}
  .logo small{display:block;font:500 10px/1 -apple-system,sans-serif;letter-spacing:.3em;color:var(--gold);margin-top:3px}
  .langs{display:flex;background:var(--bg2);border-radius:10px;padding:3px}
  .langs button{padding:5px 9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--hint)}
  .langs button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .search{position:relative}
  .search input{padding-left:38px;background:var(--bg2);border:0}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--bg);font-size:14px;font-weight:500}
  .chip.on{background:var(--text);color:var(--bg)}

  /* grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
  .card{background:var(--bg);border-radius:var(--radius);overflow:hidden;text-align:left;display:flex;flex-direction:column}
  .card .img{aspect-ratio:1;background:linear-gradient(160deg,#f7f4ee,#e9e4da);display:grid;place-items:center;position:relative}
  .card .img img,.card .img svg{width:78%;height:78%;object-fit:contain}
  .badge{position:absolute;top:10px;left:10px;background:var(--gold);color:#fff;font-size:11px;font-weight:600;
    padding:3px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.05em}
  .card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
  .card .name{font-weight:600;font-size:14px}
  .card .meta{color:var(--hint);font-size:12px}
  .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
  .price{font-weight:700}
  .add{width:32px;height:32px;border-radius:50%;background:var(--text);color:var(--bg);font-size:20px;line-height:32px;text-align:center}
  .qtyMini{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:16px;padding:2px}
  .qtyMini button{width:28px;height:28px;border-radius:50%;background:var(--bg);font-size:17px;font-weight:600}
  .qtyMini span{min-width:16px;text-align:center;font-weight:600;font-size:14px}
  .empty{text-align:center;color:var(--hint);padding:60px 24px}

  /* product sheet */
  .sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .sheet.open{transform:none}
  .hero{aspect-ratio:1/0.85;background:linear-gradient(160deg,#f7f4ee,#e3ddd1);display:grid;place-items:center;position:relative}
  .hero img,.hero svg{width:62%;height:auto;max-height:90%}
  .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);
    font-size:20px;line-height:34px;color:#222}
  .pbody{padding:20px 16px 110px}
  .pbody h1{margin:0 0 4px;font-family:Georgia,serif;font-size:24px;font-weight:600}
  .pbody .bigprice{font-size:22px;font-weight:700;color:var(--gold);margin:8px 0 14px}
  .pbody p{margin:0 0 18px;color:color-mix(in srgb,var(--text) 80%,transparent)}
  .specs{background:var(--bg2);border-radius:var(--radius);padding:4px 14px}
  .specs div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--hint) 18%,transparent);font-size:14px}
  .specs div:last-child{border:0}
  .specs span:first-child{color:var(--hint)}
  .stock{display:inline-block;margin-top:14px;font-size:13px;color:#2e9b5a}
  .stock.low{color:#d9822b}

  /* cart & checkout */
  .page{display:none;padding:16px}
  .page.show{display:block}
  .page h2{margin:4px 0 14px;font-size:22px}
  .line{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:var(--radius);padding:10px;margin-bottom:10px}
  .line .thumb{width:64px;height:64px;border-radius:12px;background:linear-gradient(160deg,#f7f4ee,#e9e4da);display:grid;place-items:center;flex:none}
  .line .thumb img,.line .thumb svg{width:80%;height:80%;object-fit:contain}
  .line .lt{flex:1;min-width:0}
  .line .lt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .lt small{color:var(--hint)}
  .summary{background:var(--bg);border-radius:var(--radius);padding:14px;margin-top:6px}
  .summary div{display:flex;justify-content:space-between;padding:4px 0}
  .summary .tot{font-weight:700;font-size:17px;border-top:1px solid color-mix(in srgb,var(--hint) 20%,transparent);margin-top:6px;padding-top:10px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--hint);margin:0 0 6px 4px}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border-radius:9px;font-weight:500;font-size:14px}
  .seg button.on{background:var(--text);color:var(--bg)}
  .err{border-color:#e5484d !important}
  .done{text-align:center;padding:70px 24px}
  .done .ok{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#fff;font-size:38px;line-height:72px;margin:0 auto 18px}

  /* fallback main button (outside Telegram) */
  #fakeMain{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;padding:15px;border-radius:14px;
    background:var(--btn);color:var(--btn-text);font-weight:600;font-size:16px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  #fakeBack{position:fixed;left:12px;top:12px;z-index:31;padding:7px 12px;border-radius:10px;background:var(--bg);display:none;
    box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:500}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;
    background:rgba(20,20,20,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- CATALOG -->
<section id="catalog">
  <div class="top">
    <div class="brand">
      <div class="logo">AVENUE<small>WATCHES</small></div>
      <div class="langs" id="langs">
        <button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button>
      </div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- CART -->
<section class="page" id="cart"></section>

<!-- CHECKOUT -->
<section class="page" id="checkout"></section>

<!-- DONE -->
<section class="page" id="done"></section>

<!-- PRODUCT SHEET -->
<div class="sheet" id="sheet"></div>

<button id="fakeBack">‹ Back</button>
<button id="fakeMain"></button>
<div class="toast" id="toast"></div>

<script>

    desc:{en:"Art-deco inspired square case in gold tone on a slim black leather strap.",
          ru:"Квадратный корпус в стиле ар-деко золотистого цвета на тонком чёрном ремешке.",
          uz:"Ar-deko uslubidagi oltinrang kvadrat korpus, ingichka qora charm tasma."}},
  { id:"av06", name:"Avenue Pulse S2", cat:"smart", style:"smart", price:1590000, stock:10, badge:"new", image:"",
    look:{dial:"#0b0b0c", casec:"#2a2a2d", strap:"#2a2a2d", shape:"rect", smart:true},

    desc:{en:"Smartwatch with AMOLED screen, heart-rate, sleep tracking and 7-day battery.",
          ru:"Смарт-часы с AMOLED-экраном, пульсометром, трекингом сна и батареей на 7 дней.",

    look:{dial:"#2b2b2b", casec:"#c9a45c", strap:"#1c1c1c", shape:"round", skeleton:true},
    specs:{size:"42 mm", movement:"Automatic skeleton", glass:"Sapphire", water:"5 ATM", strap:"Leather"},
    desc:{en:"Open-worked skeleton dial that shows the beating automatic movement.",
          ru:"Ажурный циферблат-скелетон, через который видна работа автоматического механизма.",
          uz:"Avtomatik mexanizm ishlashini ko‘rsatuvchi ochiq «skeleton» siferblat."}},
  { id:"av08", name:"Avenue Rose Mini 28", cat:"women", style:"dress", price:1490000, stock:4, badge:"", image:"",
    look:{dial:"#f3d9d4", casec:"#d8a48f", strap:"#e8c1b6", shape:"round"},
    specs:{size:"28 mm", movement:"Quartz", glass:"Mineral", water:"3 ATM", strap:"Leather"},
    desc:{en:"Petite watch with a blush-pink dial — a perfect gift.",
          ru:"Миниатюрные часы с нежно-розовым циферблатом — идеальный подарок.",
          uz:"Nozik pushti siferblatli kichkina soat — ajoyib sovg‘a."}},
];

/* =====================================================================
   3) TEXTS
   ===================================================================== */
const T = {
  uz:{all:"Hammasi",men:"Erkaklar",women:"Ayollar",smart:"Aqlli soatlar",classic:"Klassik",sport:"Sport",
      search:"Soat qidirish…",nothing:"Hech narsa topilmadi",add:"Savatga qo‘shish",inCart:"Savatda",
      cart:"Savat",cartEmpty:"Savat bo‘sh",toCart:"Savat",items:"ta",subtotal:"Mahsulotlar",deliveryFee:"Yetkazish",

      sz:"O‘lcham",mv:"Mexanizm",gl:"Oyna",wr:"Suvga chidamlilik",st:"Tasma",cur:"so‘m",back:"Orqaga",
      new:"Yangi",hit:"Xit",copied:"Buyurtma nusxalandi — menejerga yuboring",
      fallback:"Buyurtma uchun do‘konni chatdagi «🛍 Do‘kon» tugmasi orqali oching yoki menejerga yozing."},
  ru:{all:"Все",men:"Мужские",women:"Женские",smart:"Смарт-часы",classic:"Классика",sport:"Спорт",
      search:"Поиск часов…",nothing:"Ничего не найдено",add:"В корзину",inCart:"В корзине",
      cart:"Корзина",cartEmpty:"Корзина пуста",toCart:"Корзина",items:"шт",subtotal:"Товары",deliveryFee:"Доставка",
      free:"Бесплатно",total:"Итого",checkout:"Оформить заказ",name:"Ваше имя",phone:"Телефон",
      delivery:"Способ получения",pickup:"Самовывоз",courier:"Курьером",address:"Адрес",
      comment:"Комментарий (необязательно)",place:"Отправить заказ",sent:"Заказ принят!",
      sentText:"Наш менеджер скоро свяжется с вами.",fill:"Пожалуйста, заполните поля",
      added:"Добавлено в корзину",inStock:"В наличии",low:"Осталось мало",
      sz:"Размер",mv:"Механизм",gl:"Стекло",wr:"Водозащита",st:"Ремешок",cur:"сум",back:"Назад",
      new:"Новинка",hit:"Хит",copied:"Заказ скопирован — отправьте менеджеру",
      fallback:"Чтобы оформить заказ, откройте магазин кнопкой «🛍 Магазин» в чате или напишите менеджеру."},
  en:{all:"All",men:"Men",women:"Women",smart:"Smart",classic:"Classic",sport:"Sport",
      search:"Search watches…",nothing:"Nothing found",add:"Add to cart",inCart:"In cart",
      cart:"Cart",cartEmpty:"Your cart is empty",toCart:"Cart",items:"pcs",subtotal:"Items",deliveryFee:"Delivery",
      free:"Free",total:"Total",checkout:"Checkout",name:"Your name",phone:"Phone number",
      delivery:"Delivery method",pickup:"Store pickup",courier:"Courier",address:"Address",
      comment:"Comment (optional)",place:"Place order",sent:"Order received!",
      sentText:"Our manager will contact you shortly.",fill:"Please fill in the fields",
      added:"Added to cart",inStock:"In stock",low:"Only a few left",
      sz:"Size",mv:"Movement",gl:"Glass",wr:"Water resistance",st:"Strap",cur:"UZS",back:"Back",
      new:"New",hit:"Bestseller",copied:"Order copied — send it to the manager",
      fallback:"To order, open the store with the “🛍 Shop” button in the chat, or message the manager."}
};
const COURIER_FEE = 0; // set e.g. 30000 to charge for courier delivery

/* =====================================================================
   4) APP
   ===================================================================== */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== "unknown");
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor("bg_color"); }catch(e){} }

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let lang = store.get("av_lang", null) ||
  ({uz:"uz",ru:"ru"}[(tg?.initDataUnsafe?.user?.language_code||"").slice(0,2)] || DEFAULT_LANG);
let cart = store.get("av_cart", {});          // {id: qty}
let filter = "all", query = "", view = "catalog", openId = null;
let form = store.get("av_form", {name: tg?.initDataUnsafe?.user?.first_name || "", phone:"+998 ", method:"pickup", address:"", comment:""});

const t = k => T[lang][k] ?? k;
const byId = id => PRODUCTS.find(p=>p.id===id);
const money = n => n.toLocaleString("ru-RU").replace(/\u00a0/g," ") + " " + t("cur");
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
const subtotal = () => Object.entries(cart).reduce((s,[id,q])=>s+(byId(id)?.price||0)*q,0);
const fee = () => form.method==="courier" ? COURIER_FEE : 0;
const haptic = (type="light") => { try{ tg.HapticFeedback.impactOccurred(type); }catch(e){} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- drawn watch (used when no photo) ---------- */
function watchArt(p){
  if (p.image) return `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`;
  const L = p.look, c=L.casec, d=L.dial, s=L.strap;
  const strapTop = `<rect x="78" y="0" width="44" height="62" rx="8" fill="${s}"/>`;
  const strapBot = `<rect x="78" y="198" width="44" height="62" rx="8" fill="${s}"/>`;
  if (L.shape==="rect"){
    return `<svg viewBox="0 0 200 260">${strapTop}${strapBot}
      <rect x="52" y="48" width="96" height="164" rx="30" fill="${c}"/>
      <rect x="60" y="56" width="80" height="148" rx="24" fill="${d}"/>
      <rect x="148" y="100" width="6" height="22" rx="3" fill="${c}"/>
      <text x="100" y="120" fill="#fff" font-size="30" font-weight="600" text-anchor="middle" font-family="-apple-system,sans-serif">10:09</text>
      <circle cx="100" cy="158" r="16" fill="none" stroke="#e8505b" stroke-width="5" stroke-dasharray="70 100" transform="rotate(-90 100 158)"/>
      <circle cx="100" cy="158" r="16" fill="none" stroke="#b08d57" stroke-width="2" opacity=".5"/></svg>`;
  }
  if (L.shape==="square"){
    return `<svg viewBox="0 0 200 260">${strapTop}${strapBot}
      <rect x="56" y="74" width="88" height="112" rx="14" fill="${c}"/>
      <rect x="64" y="82" width="72" height="96" rx="9" fill="${d}"/>
      ${[0,1,2,3].map(i=>`<rect x="${i%2?96:96}" y="${i<2?88:164}" width="8" height="2" fill="#8a7a5a" transform="rotate(${i*0} 100 130)"/>`).join("")}
      <line x1="100" y1="130" x2="100" y2="100" stroke="#222" stroke-width="3" stroke-linecap="round"/>
      <line x1="100" y1="130" x2="120" y2="140" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="100" cy="130" r="3" fill="${c}"/><rect x="144" y="124" width="7" height="12" rx="2" fill="${c}"/></svg>`;
  }
  const light = parseInt(d.slice(1,3),16) > 160;
  const ink = light ? "#3a3326" : "#f1ead8";
  const ticks = Array.from({length:12},(_,i)=>`<line x1="100" y1="${i%3?79:77}" x2="100" y2="${i%3?85:89}" stroke="${ink}" stroke-width="${i%3?1.6:3}" transform="rotate(${i*30} 100 130)"/>`).join("");
  const bezel = L.bezel ? `<circle cx="100" cy="130" r="62" fill="${L.bezel}"/>` +
    Array.from({length:12},(_,i)=>`<line x1="100" y1="70" x2="100" y2="76" stroke="#d9e2dd" stroke-width="2" transform="rotate(${i*30} 100 130)"/>`).join("") : "";
  const subs = L.chrono ? [[80,130],[120,130],[100,152]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${ink}" stroke-width="1" opacity=".7"/>`).join("") : "";
  const skel = L.skeleton ? `<circle cx="100" cy="130" r="34" fill="none" stroke="${c}" stroke-width="1.5" opacity=".8"/>
    <circle cx="86" cy="122" r="12" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="116" cy="142" r="15" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="112" cy="112" r="7" fill="none" stroke="#b33" stroke-width="1.5"/>` : "";
  return `<svg viewBox="0 0 200 260">${strapTop}${strapBot}
    <rect x="160" y="122" width="10" height="16" rx="3" fill="${c}"/>
    <circle cx="100" cy="130" r="${L.bezel?68:62}" fill="${c}"/>${bezel}
    <circle cx="100" cy="130" r="${L.bezel?52:55}" fill="${d}"/>
    <circle cx="100" cy="130" r="${L.bezel?52:55}" fill="url(#sh${p.id})" opacity=".35"/>
    <defs><radialGradient id="sh${p.id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    ${ticks}${subs}${skel}
    <text x="100" y="${L.chrono?110:104}" fill="${ink}" font-size="7" letter-spacing="2" text-anchor="middle" font-family="Georgia,serif">AVENUE</text>
    <line x1="100" y1="130" x2="100" y2="94" stroke="${ink}" stroke-width="3.2" stroke-linecap="round" transform="rotate(-60 100 130)"/>
    <line x1="100" y1="130" x2="100" y2="84" stroke="${ink}" stroke-width="2.2" stroke-linecap="round" transform="rotate(55 100 130)"/>
    <line x1="100" y1="140" x2="100" y2="82" stroke="#c0392b" stroke-width="1" transform="rotate(170 100 130)"/>
    <circle cx="100" cy="130" r="3.5" fill="${ink}"/></svg>`;
}

/* ---------- Telegram Main/Back buttons with browser fallback ---------- */
let mainHandler = null, backHandler = null;
function setMain(text, handler){
  mainHandler = handler;
  if (inTg){
    if (text){ tg.MainButton.setParams({text, color:"#b08d57", text_color:"#ffffff", is_visible:true, is_active:true}); }
    else tg.MainButton.hide();
  } else {
    const b=$("#fakeMain"); b.textContent=text||""; b.style.display=text?"block":"none";
  }
}
function setBack(handler){
  backHandler = handler;
  if (inTg){ handler ? tg.BackButton.show() : tg.BackButton.hide(); }
  else { const b=$("#fakeBack"); b.textContent="‹ "+t("back"); b.style.display=handler?"block":"none"; }
}
if (inTg){ tg.MainButton.onClick(()=>mainHandler&&mainHandler()); tg.BackButton.onClick(()=>backHandler&&backHandler()); }
$("#fakeMain").onclick=()=>mainHandler&&mainHandler();
$("#fakeBack").onclick=()=>backHandler&&backHandler();

function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }

/* ---------- cart ops ---------- */
function setQty(id, q){
  const p = byId(id); q = Math.max(0, Math.min(q, p.stock));
  if (q===0) delete cart[id]; else cart[id]=q;
  store.set("av_cart", cart); haptic(); render();
}

/* ---------- views ---------- */
function renderCatalog(){
  $("#q").placeholder = t("search");
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  const cats = ["all","men","women","smart","classic","sport"];
  $("#chips").innerHTML = cats.map(c=>`<button class="chip ${c===filter?"on":""}" data-c="${c}">${t(c)}</button>`).join("");
  const q = query.trim().toLowerCase();
  const list = PRODUCTS.filter(p=>
    (filter==="all" || p.cat===filter || p.style===filter) &&
    (!q || (p.name+" "+p.desc[lang]).toLowerCase().includes(q)));
  $("#grid").innerHTML = list.length ? list.map(p=>{
    const n = cart[p.id]||0;
    return `<div class="card" data-open="${p.id}">
      <div class="img">${p.badge?`<span class="badge">${t(p.badge)}</span>`:""}${watchArt(p)}</div>
      <div class="info"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.specs.size)} · ${esc(p.specs.movement)}</div>
        <div class="row"><span class="price">${money(p.price)}</span>
          ${n ? `<div class="qtyMini"><button data-dec="${p.id}">−</button><span>${n}</span><button data-inc="${p.id}">+</button></div>`
              : `<button class="add" data-inc="${p.id}" aria-label="add">+</button>`}
        </div></div></div>`;
  }).join("") : `<div class="empty" style="grid-column:1/-1">${t("nothing")}</div>`;
}

function renderSheet(){
  const p = byId(openId); if(!p) return;
  const n = cart[p.id]||0;
  $("#sheet").innerHTML = `
    <div class="hero">${watchArt(p)}<button class="close" data-close>×</button></div>
    <div class="pbody">
      <h1>${esc(p.name)}</h1>
      <div class="bigprice">${money(p.price)}</div>
      <p>${esc(p.desc[lang])}</p>
      <div class="specs">
        <div><span>${t("sz")}</span><span>${esc(p.specs.size)}</span></div>
        <div><span>${t("mv")}</span><span>${esc(p.specs.movement)}</span></div>
        <div><span>${t("gl")}</span><span>${esc(p.specs.glass)}</span></div>
        <div><span>${t("wr")}</span><span>${esc(p.specs.water)}</span></div>
        <div><span>${t("st")}</span><span>${esc(p.specs.strap)}</span></div>
      </div>
      <span class="stock ${p.stock<=2?"low":""}">● ${p.stock<=2?t("low"):t("inStock")}</span>
      ${n?`<div style="display:flex;justify-content:center;margin-top:20px"><div class="qtyMini" style="transform:scale(1.25)">
        <button data-dec="${p.id}">−</button><span>${n}</span><button data-inc="${p.id}">+</button></div></div>`:""}
    </div>`;
}

function renderCart(){
  const ids = Object.keys(cart);
  $("#cart").innerHTML = `<h2>${t("cart")}</h2>` + (ids.length ? ids.map(id=>{
    const p=byId(id); if(!p) return "";
    return `<div class="line"><div class="thumb">${watchArt(p)}</div>
      <div class="lt"><b>${esc(p.name)}</b><small>${money(p.price)}</small></div>
      <div class="qtyMini"><button data-dec="${id}">−</button><span>${cart[id]}</span><button data-inc="${id}">+</button></div></div>`;
  }).join("") + `<div class="summary"><div class="tot"><span>${t("total")}</span><span>${money(subtotal())}</span></div></div>`
  : `<div class="empty">${t("cartEmpty")}</div>`);
}

function renderCheckout(){
  $("#checkout").innerHTML = `<h2>${t("checkout")}</h2>
    <div class="field"><label>${t("name")}</label><input id="f_name" value="${esc(form.name)}" autocomplete="name"></div>
    <div class="field"><label>${t("phone")}</label><input id="f_phone" type="tel" value="${esc(form.phone)}" autocomplete="tel"></div>
    <div class="field"><label>${t("delivery")}</label><div class="seg">
      <button data-m="pickup" class="${form.method==="pickup"?"on":""}">${t("pickup")}</button>
      <button data-m="courier" class="${form.method==="courier"?"on":""}">${t("courier")}</button></div></div>
    ${form.method==="courier"?`<div class="field"><label>${t("address")}</label><input id="f_address" value="${esc(form.address)}"></div>`:""}
    <div class="field"><label>${t("comment")}</label><textarea id="f_comment" rows="2">${esc(form.comment)}</textarea></div>
    <div class="summary">
      <div><span>${t("subtotal")} (${cartCount()} ${t("items")})</span><span>${money(subtotal())}</span></div>
      <div><span>${t("deliveryFee")}</span><span>${fee()?money(fee()):t("free")}</span></div>
      <div class="tot"><span>${t("total")}</span><span>${money(subtotal()+fee())}</span></div>
    </div>`;
  ["name","phone","address","comment"].forEach(k=>{
    const el=$("#f_"+k); if(el) el.oninput=()=>{ form[k]=el.value; el.classList.remove("err"); store.set("av_form",form); };
  });
}

function show(v){
  view = v;
  $("#catalog").style.display = v==="catalog" ? "block" : "none";
  ["cart","checkout","done"].forEach(id=>$("#"+id).classList.toggle("show", v===id));
  window.scrollTo(0,0); render();
}

function render(){
  const count = cartCount();
  if (openId){
    renderSheet();
    const p=byId(openId), n=cart[openId]||0;
    setBack(()=>closeSheet());
    setMain(n ? `${t("toCart")} · ${count} ${t("items")} · ${money(subtotal())}` : `${t("add")} · ${money(p.price)}`,
      n ? ()=>{ closeSheet(); show("cart"); } : ()=>{ setQty(p.id,1); toast(t("added")); });
  }
  if (view==="catalog"){ renderCatalog(); if(!openId){ setBack(null); setMain(count?`${t("toCart")} · ${count} ${t("items")} · ${money(subtotal())}`:"", ()=>show("cart")); } }
  if (view==="cart"){ renderCart(); setBack(()=>show("catalog")); setMain(count?t("checkout"):"", ()=>show("checkout")); }
  if (view==="checkout"){ renderCheckout(); setBack(()=>show("cart")); setMain(`${t("place")} · ${money(subtotal()+fee())}`, placeOrder); }
  if (view==="done"){ setBack(null); setMain("", null); }
}

function openSheet(id){ openId=id; $("#sheet").classList.add("open"); $("#sheet").scrollTop=0; haptic(); render(); }
function closeSheet(){ openId=null; $("#sheet").classList.remove("open"); render(); }

/* ---------- order ---------- */
function placeOrder(){
  let bad=false;
  const need = ["name","phone"].concat(form.method==="courier"?["address"]:[]);
  need.forEach(k=>{ const ok = k==="phone" ? form.phone.replace(/\D/g,"").length>=9 : form[k].trim().length>1;
    if(!ok){ bad=true; $("#f_"+k)?.classList.add("err"); } });
  if (bad){ try{ tg.HapticFeedback.notificationOccurred("error"); }catch(e){} toast(t("fill")); return; }

  const order = {
    v:1, lang,
    items: Object.entries(cart).map(([id,q])=>{ const p=byId(id); return [id,p.name,q,p.price]; }),
    total: subtotal()+fee(), fee: fee(),
    name: form.name.trim(), phone: form.phone.trim(), method: form.method,
    address: form.method==="courier" ? form.address.trim() : "", comment: form.comment.trim()
  };

  // Works when the app was opened from the bot's keyboard button ("🛍 Shop").
  const canSendData = inTg && !tg.initDataUnsafe?.query_id && typeof tg.sendData === "function";
  if (canSendData){
    try{ tg.HapticFeedback.notificationOccurred("success"); }catch(e){}
    clearCart();
    tg.sendData(JSON.stringify(order));   // closes the mini app; bot receives the order
    return;
  }
  // Fallback (opened from menu button / link / browser): copy order text and open manager chat
  const text = orderText(order);
  try{ navigator.clipboard.writeText(text); }catch(e){}
  clearCart();
  $("#done").innerHTML = `<div class="done"><div class="ok">✓</div><h2>${t("sent")}</h2>
    <p style="color:var(--hint)">${t("fallback")}</p>
    <textarea readonly rows="8" style="margin-top:14px;font-size:13px">${esc(text)}</textarea></div>`;
  show("done");
  setMain("@"+MANAGER_USERNAME, ()=>{
    const url="https://t.me/"+MANAGER_USERNAME;
    if (inTg) tg.openTelegramLink(url); else window.open(url,"_blank");
  });
  toast(t("copied"));
}
function orderText(o){
  return `🛍 Avenue Watches\n` + o.items.map(([,n,q,p])=>`• ${n} × ${q} = ${money(p*q)}`).join("\n") +
    `\n${t("total")}: ${money(o.total)}\n👤 ${o.name}\n📞 ${o.phone}\n🚚 ${t(o.method)}${o.address?": "+o.address:""}` +
    (o.comment?`\n💬 ${o.comment}`:"");
}
function clearCart(){ cart={}; store.set("av_cart",cart); }

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-inc],[data-dec],[data-open],[data-c],[data-l],[data-m],[data-close]");
  if(!el) return;
  if (el.dataset.inc){ e.stopPropagation(); const had=cart[el.dataset.inc]; setQty(el.dataset.inc,(cart[el.dataset.inc]||0)+1); if(!had) toast(t("added")); return; }
  if (el.dataset.dec){ e.stopPropagation(); setQty(el.dataset.dec,(cart[el.dataset.dec]||0)-1); return; }
  if (el.dataset.close!==undefined){ closeSheet(); return; }
  if (el.dataset.open){ openSheet(el.dataset.open); return; }
  if (el.dataset.c){ filter=el.dataset.c; haptic(); render(); return; }
  if (el.dataset.l){ lang=el.dataset.l; store.set("av_lang",lang); haptic(); render(); return; }
  if (el.dataset.m){ form.method=el.dataset.m; store.set("av_form",form); haptic(); render(); return; }
});
$("#q").addEventListener("input", e=>{ query=e.target.value; renderCatalog(); });

show("catalog");
</script>
</body>
</html>
